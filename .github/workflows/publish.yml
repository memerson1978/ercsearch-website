# Publishes the site with GitHub Pages every time main changes.
# Each run downloads any photos, logos or documents not yet in the repository (scripts/fetch-assets.sh)
# and saves them into it, so the repository holds everything.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download any missing images and logos
        run: |
          sh scripts/fetch-assets.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img uploads privacy-policy.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Add downloaded images and logos"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
